<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Project_8</title>
    <script src="../JS/script8.js" defer></script>
    <link rel="stylesheet" href="../Style/style8.css">
</head>
<body>
    <div class="game">
        <h1>🎲 Більше число</h1>
        <div class="players">
            <div class="player">
                <h2 id="name1">Гравець</h2>
                <p id="score1">Кількість балів: 0</p>
                <div id="number1" class="number">?</div>
            </div>
            <div class="player">
                <h2 id="name2">Комп'ютер</h2>
                <p id="score2">Кількість балів: 0</p>
                <div id="number2" class="number">?</div>
            </div>
        </div>
        <p id="result">Натисни кнопку, щоб почати!</p>
        <button id="play">Кинути числа</button>
        <button id="restart">Нова гра</button>
    </div>
</body>
</html>
