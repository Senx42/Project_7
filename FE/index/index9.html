 <!DOCTYPE html>

</head>
<body>
    <div class="game">

                <h2 id="name1">Гравець</h2>

            <div class="player">

                <div id="card2" class="card">?</div>

        </div>
        <p id="result">Натисни кнопку, щоб витягнути карти!</p>
        <button id="play">Витягнути карти</button>
        <button id="restart">Нова гра</button>
    </div>
</body>
</html>
